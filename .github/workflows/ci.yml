name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run test:ts:back
      - run: npm run test:ts:front
      - run: npm test
      - run: npm run build
      - run: npm run verify

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) requires npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      # Authenticated via npm trusted publishing (OIDC): no NPM_TOKEN needed.
      # Provenance is generated automatically.
      # Pre-releases (e.g. v1.0.0-beta.1) are published with the `next` dist-tag.
      - run: npm publish --access public --tag ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
